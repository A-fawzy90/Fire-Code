<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Midnight Shield Gradient -->
    <linearGradient id="favShieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Golden-Crimson Protective Rim -->
    <linearGradient id="favShieldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="30%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Fire Extinguishing Water Arc Gradient -->
    <linearGradient id="favWaterArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Central Fire Flame Gradient -->
    <linearGradient id="favFlameGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="25%" stop-color="#ea580c" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="90%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Yellow Base Line Glow Filter -->
    <filter id="favGlowYellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Protective Fire Safety Shield -->
  <path 
    d="M256 24 
       C370 24 456 56 456 136 
       C456 286 370 416 256 492 
       C142 416 56 286 56 136 
       C56 56 142 24 256 24 Z" 
    fill="url(#favShieldBg)" 
    stroke="url(#favShieldRim)" 
    stroke-width="20"
    stroke-linejoin="round"
  />

  <!-- 2. Inner Shield Highlight Ring -->
  <path 
    d="M256 46 
       C352 46 430 74 430 144 
       C430 274 352 392 256 462 
       C160 392 82 274 82 144 
       C82 74 160 46 256 46 Z" 
    fill="none" 
    stroke="rgba(255, 255, 255, 0.15)" 
    stroke-width="5"
  />

  <!-- 3. The Engineering Fire Triangle (الكود ٣٠٥) -->
  <!-- Left Side: Heat to Oxygen -->
  <line x1="256" y1="110" x2="130" y2="340" stroke="#f87171" stroke-width="14" stroke-linecap="round" opacity="0.9" />
  
  <!-- Right Side: Heat to Fuel -->
  <line x1="256" y1="110" x2="382" y2="340" stroke="#fb923c" stroke-width="14" stroke-linecap="round" opacity="0.9" />

  <!-- The Golden Yellow Base Line (بين الوقود والأكسجين) -->
  <line 
    x1="130" 
    y1="340" 
    x2="382" 
    y2="340" 
    stroke="#fde047" 
    stroke-width="18" 
    stroke-linecap="round"
    filter="url(#favGlowYellow)"
  />

  <!-- Three Triangle Vertex Nodes (Heat, Oxygen, Fuel) -->
  <circle cx="256" cy="110" r="18" fill="#dc2626" stroke="#fef08a" stroke-width="5" />
  <circle cx="130" cy="340" r="18" fill="#0284c7" stroke="#fef08a" stroke-width="5" />
  <circle cx="382" cy="340" r="18" fill="#ea580c" stroke="#fef08a" stroke-width="5" />

  <!-- 4. Fire Fighting Water Extinguishment Arc -->
  <path 
    d="M170 320 
       C125 250 145 170 205 130 
       C168 170 172 240 215 285 
       Z" 
    fill="url(#favWaterArc)" 
  />

  <!-- Water Extinguishment Droplets -->
  <circle cx="175" cy="155" r="10" fill="#38bdf8" />
  <circle cx="150" cy="205" r="8" fill="#67e8f9" />
  <circle cx="140" cy="260" r="9" fill="#38bdf8" />

  <!-- 5. Majestic Central Fire Flame -->
  <path 
    d="M256 150
       C282 200 330 240 330 300
       C330 355 292 385 256 385
       C220 385 182 355 182 300
       C182 250 215 210 236 180
       C238 215 260 250 268 265
       C276 235 270 195 256 150 Z" 
    fill="url(#favFlameGrad)" 
  />

  <!-- 6. White-Hot Fire Ignition Core -->
  <path 
    d="M256 255
       C272 285 288 310 288 335
       C288 360 270 375 256 375
       C242 375 224 360 224 335
       C224 310 240 285 256 255 Z" 
    fill="#ffffff" 
    opacity="0.95" 
  />
</svg>